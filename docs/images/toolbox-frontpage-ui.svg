<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Googlebook Toolbox desktop UI preview showing left navigation pane with cursor hover pop-up and right utility pane">
  <defs>
    <filter id="winShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="hoverShadow" x="-8%" y="-8%" width="118%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ambient Studio Backdrop -->
  <rect width="1120" height="620" rx="24" fill="#E6EFEE"/>

  <!-- Desktop Freeform Window -->
  <g filter="url(#winShadow)">
    <rect x="32" y="26" width="1056" height="568" rx="20" fill="#F6FAFA" stroke="#CBDAD8" stroke-width="1.5"/>
  </g>

  <!-- Window Caption Bar -->
  <path d="M32 46 Q32 26 52 26 L1068 26 Q1088 26 1088 46 L1088 62 L32 62 Z" fill="#EAF2F1"/>
  <circle cx="58" cy="44" r="6" fill="#94A3B8"/>
  <circle cx="78" cy="44" r="6" fill="#94A3B8"/>
  <circle cx="98" cy="44" r="6" fill="#94A3B8"/>
  <text x="560" y="48" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">Googlebook Toolbox</text>
  <line x1="32" y1="62" x2="1088" y2="62" stroke="#D5E2E0" stroke-width="1"/>

  <!-- Left Navigation Pane -->
  <path d="M32 62 L352 62 L352 594 L52 594 Q32 594 32 574 Z" fill="#EDF5F4"/>
  <line x1="352" y1="62" x2="352" y2="594" stroke="#CBDAD8" stroke-width="1"/>

  <!-- Left Pane Brand Header -->
  <g transform="translate(50, 82) scale(0.42)">
    <rect x="2" y="2" width="104" height="104" rx="26" fill="#FFFFFF"/>
    <path d="M2 68 L106 38 L106 80 Q106 106 80 106 L28 106 Q2 106 2 80 Z" fill="#D9ECE9"/>
    <rect x="25" y="31" width="58" height="39" rx="5" fill="#1E293B"/>
    <rect x="28" y="34" width="52" height="33" rx="2.5" fill="#FFFFFF"/>
    <circle cx="54" cy="50.5" r="8.5" fill="none" stroke="#4285F4" stroke-width="3.6"/>
    <path d="M18 70 L90 70 Q91.5 76 85.5 76 L22.5 76 Q16.5 76 18 70 Z" fill="#334155"/>
  </g>
  <text x="106" y="110" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Googlebook Toolbox</text>
  <circle cx="320" cy="105" r="13" fill="#DDECEB"/>
  <text x="320" y="110" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#00696B">i</text>

  <!-- Nav Option 1 (Selected & Hovered) -->
  <rect x="48" y="144" width="288" height="64" rx="18" fill="#00696B"/>
  <rect x="62" y="157" width="38" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.18"/>
  <rect x="72" y="166" width="18" height="13" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <rect x="85" y="170" width="7" height="12" rx="1.5" fill="#00696B" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="112" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">Check your companion phone</text>
  <text x="112" y="190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">connection status</text>

  <!-- Nav Option 2 -->
  <rect x="48" y="220" width="288" height="60" rx="18" fill="#FFFFFF" stroke="#DCE8E6" stroke-width="1"/>
  <rect x="62" y="231" width="38" height="38" rx="11" fill="#DDECEB"/>
  <circle cx="81" cy="250" r="8" fill="none" stroke="#00696B" stroke-width="2"/>
  <path d="M81 245 L81 250 L85 252" fill="none" stroke="#00696B" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="246" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#0F172A">Enable desktop restorer on</text>
  <text x="112" y="264" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#0F172A">reboot</text>

  <!-- Right Pane: Active Utility (Feature Checker + App Restorer Preview Strip) -->
  <rect x="353" y="62" width="735" height="56" fill="#EDF5F4"/>
  <text x="380" y="88" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Googlebook Feature Checker</text>
  <circle cx="385" cy="104" r="4" fill="#15803D"/>
  <text x="395" y="108" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">All 7 dependencies met · Googlebook Pro</text>

  <!-- Theme Switcher + Recheck Pill -->
  <rect x="838" y="74" width="138" height="30" rx="15" fill="#DDECEB"/>
  <rect x="840" y="76" width="52" height="26" rx="13" fill="#00696B"/>
  <text x="866" y="93" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">System</text>
  <text x="912" y="93" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#0F172A">Light</text>
  <text x="952" y="93" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#0F172A">Dark</text>
  <rect x="986" y="74" width="80" height="30" rx="15" fill="#00696B"/>
  <text x="1026" y="93" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">Recheck</text>

  <!-- 3-Column Dependency Checklist Header -->
  <text x="382" y="146" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#00696B">DEPENDENCIES</text>
  <text x="690" y="146" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#00696B">THIS GOOGLEBOOK</text>
  <text x="880" y="146" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#00696B">COMPANION PHONE</text>

  <!-- Checklist Card Rows -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <!-- Row 1 -->
    <rect x="376" y="158" width="690" height="54" rx="14" fill="#FFFFFF" stroke="#E2ECEB" stroke-width="1"/>
    <circle cx="400" cy="185" r="10" fill="#15803D"/>
    <text x="400" y="189" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="420" y="181" font-size="13" font-weight="600" fill="#0F172A">1. Android 17 / One UI 9.0</text>
    <text x="420" y="198" font-size="11.5" fill="#64748B">OS baseline for Better Together sync</text>
    <rect x="690" y="173" width="62" height="24" rx="12" fill="#DCFCE7"/>
    <text x="721" y="189" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">✓ Met</text>
    <text x="880" y="189" font-size="11.5" fill="#475569">Verify Android 17 / One UI 9+</text>

    <!-- Row 2 -->
    <rect x="376" y="220" width="690" height="54" rx="14" fill="#FFFFFF" stroke="#E2ECEB" stroke-width="1"/>
    <circle cx="400" cy="247" r="10" fill="#15803D"/>
    <text x="400" y="251" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="420" y="243" font-size="13" font-weight="600" fill="#0F172A">2. Google Play services (v26.37+)</text>
    <text x="420" y="260" font-size="11.5" fill="#64748B">Installed: v26.38.12</text>
    <rect x="690" y="235" width="62" height="24" rx="12" fill="#DCFCE7"/>
    <text x="721" y="251" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">✓ Met</text>
    <text x="880" y="251" font-size="11.5" fill="#475569">Play services v26.37+ on phone</text>

    <!-- Row 3 -->
    <rect x="376" y="282" width="690" height="54" rx="14" fill="#FFFFFF" stroke="#E2ECEB" stroke-width="1"/>
    <circle cx="400" cy="309" r="10" fill="#15803D"/>
    <text x="400" y="313" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="420" y="305" font-size="13" font-weight="600" fill="#0F172A">3. Cross-device services (v1.0.1346+)</text>
    <text x="420" y="322" font-size="11.5" fill="#64748B">com.google.ambient.streaming · v1.0.1400</text>
    <rect x="690" y="297" width="62" height="24" rx="12" fill="#DCFCE7"/>
    <text x="721" y="313" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">✓ Met</text>
    <text x="880" y="313" font-size="11.5" fill="#475569">Cross-device v1.0.1346+ on phone</text>

    <!-- Row 4 -->
    <rect x="376" y="344" width="690" height="54" rx="14" fill="#FFFFFF" stroke="#E2ECEB" stroke-width="1"/>
    <circle cx="400" cy="371" r="10" fill="#15803D"/>
    <text x="400" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="420" y="367" font-size="13" font-weight="600" fill="#0F172A">4. Private home Wi-Fi &amp; no active VPN</text>
    <text x="420" y="384" font-size="11.5" fill="#64748B">Connected to Wi-Fi: HomeFiber</text>
    <rect x="690" y="359" width="62" height="24" rx="12" fill="#DCFCE7"/>
    <text x="721" y="375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803D">✓ Met</text>
    <text x="880" y="375" font-size="11.5" fill="#475569">Connect phone to &quot;HomeFiber&quot;</text>

    <!-- Tool #2 Preview Card at Bottom of Right Pane -->
    <rect x="376" y="418" width="690" height="150" rx="16" fill="#EDF5F4" stroke="#CBDAD8" stroke-width="1.2"/>
    <text x="398" y="446" font-size="14" font-weight="700" fill="#0F172A">Tool #2 · Enable desktop restorer on reboot (Googlebook App Restorer)</text>
    <rect x="398" y="458" width="388" height="26" rx="13" fill="#188038"/>
    <text x="592" y="475" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Keeping track of open apps and windows to restore on reboot</text>
    <text x="398" y="508" font-size="12.5" fill="#334155">• Preserves freeform window bounds, maximized/snapped/minimized states &amp; Z-order across reboots</text>
    <text x="398" y="530" font-size="12.5" fill="#334155">• Recreates Virtual Desks (Desk 1..N), multi-monitor layouts, TWAs &amp; open Chrome tabs</text>
    <text x="398" y="552" font-size="12.5" fill="#334155">• 100% Offline (zero INTERNET permission) · Zero Root or ADB required</text>
  </g>

  <!-- Cursor Pointer + Floating Hover Pop-up Below Option 1 -->
  <g filter="url(#hoverShadow)">
    <rect x="54" y="216" width="308" height="68" rx="14" fill="#FFFFFF" stroke="#B6CCC9" stroke-width="1.2"/>
    <text x="68" y="238" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#0F172A">Checks Better Together cross-device requirements,</text>
    <text x="68" y="255" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#0F172A">fixes missing dependencies on your Googlebook,</text>
    <text x="68" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#0F172A">and shows what to verify on your phone.</text>
  </g>

  <!-- Desktop Cursor Arrow -->
  <path d="M262 192 L262 212 L267 207 L271 216 L275 214 L271 205 L278 205 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
